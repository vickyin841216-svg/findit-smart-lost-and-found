# Application Information
spring.application.name=FindIt - Smart Lost & Found System
server.port=8080

# H2 Database Configuration
# Uses a file-based or persistent in-memory database
spring.datasource.url=jdbc:h2:mem:finditdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Enable H2 Web Console (accessible at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Smart Match Tuning Weights (Defaults)
findit.match.threshold=0.55
findit.match.weight.category=0.25
findit.match.weight.text=0.35
findit.match.weight.location=0.20
findit.match.weight.date=0.10
findit.match.weight.attributes=0.10
